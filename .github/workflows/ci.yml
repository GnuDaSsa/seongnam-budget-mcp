name: Validate budget MCP
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: node --check worker/server.js
  corpus:
    # 검색 회귀는 main 반영·주간 일정·수동 실행에서 확인한다. 자산이 바뀐 커밋은 공개 사이트 게시 후 통과한다.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run snapshot:download
      - run: npm run build
      - run: npm test
      - run: npm run evaluate
