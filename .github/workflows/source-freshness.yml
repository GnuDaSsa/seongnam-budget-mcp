name: Check official budget sources
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      full_hash:
        description: Stream and verify every in-scope attachment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the city index parser
        run: python -m pip install "$(grep '^beautifulsoup4==' requirements.txt)"
      - name: Run checker regression tests
        run: node --test tests/source-freshness.test.mjs
      - name: Compare city attachments with production
        env:
          FULL_HASH: ${{ inputs.full_hash }}
        shell: bash
        run: |
          flags=()
          if [[ "$FULL_HASH" == "true" ]]; then flags+=(--full-hash); fi
          node scripts/check-source-freshness.mjs "${flags[@]}" | tee budget-source-freshness.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: budget-source-freshness
          path: budget-source-freshness.json
          if-no-files-found: ignore
          retention-days: 14
